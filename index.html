  <label for="age">Вік</label>
  <select id="age"><option value="">— оберіть —</option>${["18-24","25-34","35-44","45-54","55+"].map(a=>`<option${S.age===a?" selected":""}>${a}</option>`).join("")}</select>
  <label for="code">Ваш код (потрібен для повторного проходження через 2 тижні і для видалення)</label>
  <input type="text" id="code" value="${esc(S.code)}" maxlength="16" placeholder="напр. лис7" autocomplete="off">
  <p class="mut">Придумайте код самі (4 літери + число). Не використовуйте ім'я, телефон чи пошту. Збережіть код.</p>
  <button type="button" class="lnk" id="again">${S.round===2?"Це повторне проходження (натисніть, щоб скасувати)":"Я вже проходив(ла) раніше"}</button>
  <div class="err" id="err">${esc(S.err)}</div>
  <div class="row"><button class="sec" id="prev">Назад</button><button id="go">Почати</button></div></div>
  <div class="sos">Важко? <a href="tel:7333">7333</a> · <a href="tel:0800211444">0 800 211 444</a> · <a href="tel:112">112</a></div>`;
  document.getElementById("prev").onclick=()=>{S.pre=false;render();window.scrollTo(0,0)};
  document.getElementById("again").onclick=()=>{S.age=document.getElementById("age").value;S.code=document.getElementById("code").value;S.round=S.round===2?1:2;S.err="";render()};
  document.querySelectorAll(".pk").forEach(b=>b.onclick=()=>{S.version=b.dataset.v;document.getElementById("ver").value=S.version;document.querySelectorAll(".pk").forEach(x=>{const on=x===b;x.classList.toggle("on",on);x.setAttribute("aria-checked",on)})});
  document.getElementById("go").onclick=()=>{
    const code=document.getElementById("code").value.trim();
    const v=document.getElementById("ver").value, a=document.getElementById("age").value;
    if(!v) return err("Оберіть версію."); if(!a) return err("Оберіть вік."); if(code.length<4||/[@\s]/.test(code)) return err("Код: щонайменше 4 символи, без пробілів і @.");
    S.version=v;S.age=a;S.code=code;S.round=S.round===2?2:1;S.err="";
    if(S.fix){S.fix=false;S.step="end";save();render();return}
    S.i=0;S.ans={};S.step="q";save();render()};
}

  $.innerHTML=`<div class="mut">${S.i} з ${n}</div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${S.i}"><i style="width:${(S.i/n*100).toFixed(0)}%"></i></div>
  <div class="card ms"><img alt="" src="${MS_IMG[m]}"><h2>${esc(t[0])}</h2><p>${esc(t[1])}</p>
  <div class="row"><button id="msgo" style="width:100%">Продовжити</button></div></div>
  <div class="sos">Важко? <a href="tel:7333">7333</a> · <a href="tel:0800211444">0 800 211 444</a> · <a href="tel:112">112</a></div>`;
  document.getElementById("msgo").onclick=()=>{S.step="q";render();window.scrollTo(0,0)};
  window.onkeydown=e=>{if(S.step==="ms"&&e.key==="Enter")document.getElementById("msgo").click()};
}
function renderQ(){
  const list=ITEMS[S.version],n=list.length,i=S.i,cur=S.ans[i+1];
  const mins=Math.max(1,Math.ceil((n-i)*0.28));
  $.innerHTML=`<div class="mut">${i+1} з ${n} · ≈ ${mins} хв залишилось</div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${i}"><i style="width:${(i/n*100).toFixed(0)}%"></i></div>
  <div class="card"><p style="font-size:1.1rem;margin-top:0">${esc(list[i])}</p>
  <div class="mut">Наскільки це про вас останнім часом (приблизно за останній рік)?</div>
  <div class="scale">${ANCH.map((t,k)=>`<button data-v="${k+1}" class="${cur===k+1?"on":""}">${k+1} — ${esc(t)}</button>`).join("")}
  <button data-v="0" class="${cur===0?"on":""}" style="background:transparent;border:1px dashed var(--mut)">Пропустити</button></div>
  <div class="row"><button class="sec" id="back" ${i===0?"disabled":""}>Назад</button>${i%14===0?`<span class="mut">Правильних відповідей нема. Перша відповідь зазвичай найточніша.</span>`:""}</div></div>
  <div class="sos">Важко? <a href="tel:7333">7333</a> · <a href="tel:0800211444">0 800 211 444</a> · <a href="tel:112">112</a></div>
  <button type="button" class="lnk" id="exit" style="font-size:.78rem;opacity:.7">Зберегти і вийти</button>`;
  document.getElementById("exit").onclick=()=>{save();S.saved=true;S.step="start";S.pre=false;S.err="";render();window.scrollTo(0,0)};
  $.querySelectorAll(".scale button").forEach(b=>b.onclick=()=>pick(+b.dataset.v));
  function pick(v){ if(S.lock) return; S.lock=true;
    S.ans[i+1]=v;save();
    $.querySelectorAll(".scale button").forEach(x=>x.classList.toggle("on",+x.dataset.v===v));
    setTimeout(()=>{S.lock=false;S.i++;if(S.i>=n){S.step="end"}else{const m=MS_AT(n).indexOf(S.i);if(m>=0&&!(S.mseen||{})[m]){S.mseen=S.mseen||{};S.mseen[m]=1;S.ms=m;S.step="ms"}}render();window.scrollTo(0,0)},280)}
  window.onkeydown=e=>{ if(S.step!=="q"||e.target.matches("input,select,textarea")) return; if("012345".includes(e.key)&&e.key.length===1) pick(+e.key)};
  document.getElementById("back").onclick=()=>{S.i=Math.max(0,S.i-1);render()};
}
function renderEnd(){
  $.innerHTML=`<h1>Майже готово</h1><div class="card">
  <label for="cl">Наскільки твердження були зрозумілі? (1 — зовсім ні, 5 — повністю)</label>
  <select id="cl"><option value="">— оберіть —</option>${[1,2,3,4,5].map(x=>`<option>${x}</option>`).join("")}</select>
  <label for="cm">Які твердження були незрозумілі або незручні? (за номером і словами, необов'язково)</label>
  <p class="mut">Не пишіть тут імен, контактів і даних про здоров'я.</p>
  <textarea id="cm" rows="4" maxlength="2000"></textarea>
  <div class="err" id="err">${esc(S.err)}</div>
  <div class="row"><button class="sec" id="back">Назад</button><button id="send" ${S.busy?"disabled":""}>Надіслати</button></div></div>
  <div class="mut">${esc(HELP)}</div>`;
  document.getElementById("back").onclick=()=>{S.step="q";S.i=ITEMS[S.version].length-1;render()};
  document.getElementById("send").onclick=submit;
}
async function submit(){
  S.clarity=document.getElementById("cl").value; S.comment=document.getElementById("cm").value.trim();
  const n=ITEMS[S.version].length, answers={};
  for(let k=1;k<=n;k++){const v=S.ans[k];answers["q"+k]=(v>=1&&v<=5)?v:null}
  const skipped=Object.values(answers).filter(v=>v===null).length;
  if(skipped>n/3) return err("Пропущено забагато тверджень ("+skipped+"). Поверніться і дайте більше відповідей.");
  S.busy=true;document.getElementById("send").disabled=true;
  try{
    const r=await fetch(SB_URL+"/rest/v1/pilot_responses",{method:"POST",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
      body:JSON.stringify({version:S.version,round:S.round||1,code:S.code,age_range:S.age,consent:true,answers,clarity:S.clarity?+S.clarity:null,comment:S.comment||null})});
    if(r.status===201){try{localStorage.removeItem("bolen-pilot")}catch(e){}S.step="done";render();return}
    if(r.status===409) {S.busy=false;S.fix=true;S.pre=true;S.step="start";S.err="Для цього коду і цього проходження відповіді вже є. Якщо це повторне проходження, натисніть «Я вже проходив(ла) раніше»; інакше змініть код. Ваші відповіді збережено.";save();render();window.scrollTo(0,0);return}
    S.busy=false;err("Не вдалося надіслати (код "+r.status+"). Спробуйте ще раз пізніше, відповіді збережено на цьому пристрої.");
  }catch(e){S.busy=false;err("Немає зв'язку. Відповіді збережено на цьому пристрої, спробуйте пізніше.")}
}

function score(){

  for(let k=1;k<=n;k++){const a=S.ans[k];if(a>=1&&a<=5){raw.push(a);vals[k]=REV[v].includes(k)?6-a:a}}
  const sc=[];for(const [name,ids] of Object.entries(KEYS[v])){const got=ids.map(i=>vals[i]).filter(x=>x!==undefined);sc.push({name,mean:got.length>=5?got.reduce((a,b)=>a+b,0)/got.length:null})}

function moreHTML(n){const d=parseDesc(n);const x=DESC2[n];if(!d.s&&!x) return "";
  return `<details class="more"><summary>Про образ</summary>${x?`<p><b>Про образ.</b> ${esc(x.a)}</p><p><b>Як це може проявлятися.</b> ${esc(x.l)}</p>`:""}${d.s?`<p><b>Сильна сторона.</b> ${esc(d.s)}</p>`:""}${d.r?`<p><b>Куди може занести.</b> ${esc(d.r)}</p>`:""}${d.q?`<p><b>Питання для роздуму.</b> ${esc(d.q)}</p>`:""}</details>`}
function spheresHTML(sorted){const t=sorted.slice(0,3).filter(s=>SPH[s.name]);if(!t.length) return "";
  return `<h3>По сферах життя</h3><p class="mut">Для трьох найгучніших образів. Це можливі прояви й питання для роздуму, а не висновки про вас.</p>`+t.map((s,i)=>`<details class="more"${i===0?" open":""}><summary>${esc(s.name)}</summary>${SPH[s.name].map(r=>`<p><b>${esc(r[0])}.</b> ${esc(r[1])}${r[2]?` <i>${esc(r[2])}</i>`:""}</p>`).join("")}</details>`).join("")}
function renderDone(){
  const R=score(),ok=R.sc.filter(s=>s.mean!==null);
  const lvl=m=>m<2.5?["lo","тихіше зараз"]:m<3.5?["mid","помірно"]:["hi","гучніше зараз"];
  const ini=n=>ARCH_IMG[n]?`<img class="ic" alt="" src="data:image/jpeg;base64,${ARCH_IMG[n]}">`:`<span class="ic" aria-hidden="true">${esc((n||"?").charAt(0))}</span>`;
  let body="",note="";
  if(R.missing>=3){body=`<p>Забагато пропусків, щоб показати профіль. Можна пройти ще раз пізніше.</p>`}
  else if(R.same>=R.thr||R.extreme>=0.8){body=`<p>Схоже, відповіді майже однакові. Профіль не показую: спробуйте ще раз, читаючи кожне твердження.</p>`}
  else{
    const hi=ok.map(s=>s.mean),spread=Math.max(...hi)-Math.min(...hi);
    const warn=spread<1.0||R.avg>=4.0||R.avg<=2.0;
    if(spread<1.0) note="Профіль рівний, піки слабо виражені.";
    if(R.avg>=4.0) note+=" Схоже, ви погоджуєтеся майже з усім, тому різницю між образами видно слабко.";
    if(R.avg<=2.0) note+=" Схоже, ви не погоджуєтеся майже з усім, тому різницю між образами видно слабко.";
    const sorted=[...ok].sort((a,b)=>b.mean-a.mean);
    const bars=sorted.map(s=>{const [c,t]=lvl(s.mean);return `<div class="prow"><div class="phead">${ini(s.name)}<span class="pname">${esc(s.name)}</span><span class="pval">${s.mean.toFixed(1)}<span class="mut"> з 5</span></span></div><div class="meter ${c}" role="img" aria-label="${esc(s.name)}: ${s.mean.toFixed(1)} з 5, ${t}"><i style="width:${((s.mean-1)/4*100).toFixed(0)}%"></i><b style="left:37.5%"></b><b style="left:62.5%"></b></div><span class="chip ${c}">${t}</span>${moreHTML(s.name)}</div>`}).join("");
    let top="";
    if(!warn){
      const loud=sorted.filter(s=>s.mean>=3.5).slice(0,3);
      top=loud.length?`<h3>Найгучніші зараз</h3>`+loud.map(s=>{const d=parseDesc(s.name);return `<article class="loud"><div class="lh">${ini(s.name).replace('class="ic"','class="ic lg"')}<b>${esc(s.name)}</b></div>${DESC2[s.name]?`<div class="fact a"><span class="k">Про образ</span><p>${esc(DESC2[s.name].a)}</p></div><div class="fact a"><span class="k">Як це може проявлятися</span><p>${esc(DESC2[s.name].l)}</p></div>`:""}<div class="fact s"><span class="k">Сильна сторона</span><p>${esc(d.s)}</p></div><div class="fact r"><span class="k">Куди може занести</span><p>${esc(d.r)}</p></div>${d.q?`<div class="fact q"><span class="k">Питання для роздуму</span><p>${esc(d.q)}</p></div>`:""}</article>`}).join(""):`<p>Виразних піків немає, відповіді рівномірні.</p>`;
    }
    const quiet=sorted.filter(s=>s.mean<2.5).slice(-1)[0];
    const qn=(!warn&&quiet)?`<div class="quiet">${ini(quiet.name)}<div><b>${esc(quiet.name)}</b>: зараз тихіший образ. Це не слабкість, а просто те, що зараз менш гучно.</div></div>`:"";
    body=`<h2>Ваші образи</h2><p class="sec-sub">Від найгучнішого до найтихішого. Шкала 1 до 5; світлі риски на шкалі: 2,5 і 3,5.</p>${bars}<div class="legend" aria-hidden="true"><span>1 тихо</span><span>5 гучно</span></div>${note?`<div class="notice" role="note">${esc(note.trim())}</div>`:""}${top}${warn?"":spheresHTML(sorted)}${qn}`;
  }
  $.innerHTML=`<div class="res"><img class="hero" alt="" src="${RES_HERO}"><h1>Дякуємо! Ваш профіль</h1><p class="lead">Це знімок на сьогодні, а не тип і не діагноз. Це порівняння образів між собою для вас, а не з іншими людьми.</p>
  <div class="card">${body}</div>
  <div class="card"><div class="code"><span class="cl">Ваш код (збережіть його)</span><span class="cv">${esc(S.code)}</span></div><p style="margin:0">Відповіді надіслано. Повторне проходження через 2 тижні нам дуже допоможе — з тим самим кодом.</p>
  <div class="crisis" role="region" aria-label="Якщо вам важко"><h3>Якщо вам зараз дуже важко</h3><p>${esc(HELP)}</p>
  <ul><li><a href="tel:112"><span>Екстрена допомога</span><span class="n">112</span></a></li><li><a href="tel:7333"><span>Lifeline Ukraine</span><span class="n">7333</span></a></li><li><a href="tel:0800211444"><span>Лінія МОМ</span><span class="n">0 800 211 444</span></a></li></ul></div></div></div>`;
  $.insertAdjacentHTML("beforeend", interestHTML());
  const ib=document.getElementById("isend"); if(ib) ib.onclick=submitInterest;
  window.scrollTo(0,0);
}
const SPHERES=["Стосунки","Стиль роботи і середовище","Ресурс і стрес","Рішення і гроші","Творчість і відпочинок"];
function interestHTML(){
  return `<div class="res"><div class="card" id="interest"><h2>Розгорнуті звіти по сферах життя: скоро</h2>
  <p class="sec-sub" style="font-size:.95rem">Ми думаємо зробити окремі розгорнуті звіти по сферах життя. Поки їх нема. Допоможіть зрозуміти, що вам цікавіше. Це не замовлення, нічого не коштує і ні до чого не зобов'язує.</p>
  <label for="isph">Яка сфера вам цікавіша?</label>
  <select id="isph"><option value="">— оберіть —</option>${SPHERES.map(x=>`<option>${esc(x)}</option>`).join("")}<option>Жодна</option></select>
  <div class="err" id="ierr"></div>
  <div class="row"><button id="isend">Надіслати</button></div></div></div>`;
}
async function submitInterest(){
  const sph=document.getElementById("isph").value, e=document.getElementById("ierr");
  if(!sph){e.textContent="Оберіть відповідь.";return}
  const b=document.getElementById("isend"); b.disabled=true;
  try{
    const r=await fetch(SB_URL+"/rest/v1/pilot_interest",{method:"POST",headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},
      body:JSON.stringify({response_code:S.code,version:S.version,sphere:sph})});
    if(r.status===201){document.getElementById("interest").innerHTML="<p><b>Дякуємо!</b> Це допоможе зробити звіти корисними.</p>";return}
    b.disabled=false;e.textContent="Не вдалося надіслати (код "+r.status+"). Спробуйте пізніше.";
  }catch(x){b.disabled=false;e.textContent="Немає зв'язку. Спробуйте пізніше."}
}
render();
</script></body></html>
